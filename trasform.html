<!-- 4.skew -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box{
      height: 200px;
      width: 200px;
      background-color: goldenrod;
      transition: transform 1s;
    

    }
    .box:hover{
      transform: skewX(50deg);
      transform: skewY(50px);
      transform: skew();

    }
  </style>
</head>
<body>
  <div class="box">
    

  </div>
</body>
</html>
