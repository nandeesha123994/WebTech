<!-- 4.General sibling -->

 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div ~ h1{
      background-color: red;
    }
  </style> 
</head>
<body>
  <div>
    <h1>heading</h1>
    <h1>heading</h1>
    <h1>heading</h1>
    <h1>heading</h1>
    <h1>heading</h1>
    </div>
    <u>underline</u>
    <h1>undeline</h1>
    <h1>heading</h1>
    
   
</body>
