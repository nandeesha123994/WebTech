<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      pad: 0;
    }
    .parent{
      height: 600px;
      
      border: 2px solid black;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap:20px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      align-content: center;
     
    }
    .child1{
      height: 100px;
      width: 100px;
      border: 2px solid black;
      background-color: green;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;

    }


  </style>
</head>
<body>
  <div class="parent">

    <div class="child1">1</div>
    <div class="child1">2</div>
    <div class="child1">3</div>
    <div class="child1">4</div>
    <div class="child1">5</div>
    
   
  
  </div>
  
</body>
</html>
